description: Bondify AI review prompt regression

prompts:
  - file://prompts/review.txt

providers:
  - id: openrouter:z-ai/glm-5.2
    config:
      max_tokens: 1800
      showThinking: false
      systemPrompt: Return only strict JSON. Do not include Markdown fences, reasoning, or prose outside the JSON object.
      temperature: 0

tests:
  - description: rejects an unsafe SQL interpolation
    vars:
      title: Unsafe profile search endpoint
      body: Adds a search endpoint for profiles.
      diff: file://fixtures/sql-injection.diff
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          const findings = Array.isArray(parsed.findings)
            ? parsed.findings.map((finding) => `${finding.file ?? ''} ${finding.detail ?? ''}`).join(' ').toLowerCase()
            : '';

          return ['REJECTED', 'NEEDS ATTENTION'].includes(parsed.verdict)
            && parsed.score <= 3
            && findings.includes('sql')
            && findings.includes('injection');

  - description: approves a clean README copy edit
    vars:
      title: Clarify product summary
      body: Updates README wording only.
      diff: file://fixtures/clean-docs.diff
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.verdict === 'APPROVED'
            && parsed.score >= 7
            && Array.isArray(parsed.findings);
